# Publica o PokeMatch no GitHub Pages.
# - A cada push na main: roda os testes, gera o site estático e publica.
# - Todo dia às 06:17 (UTC): baixa as cartas atualizadas do TCGdex e republica.
# - Camada de IA: se o segredo ANTHROPIC_API_KEY existir, na sincronização (diária ou manual) o Claude lê
#   as frases que as regras ainda não entendem; o motor confere cada resposta. Só frases novas são enviadas.
name: Site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instala as dependências (SDK da Anthropic e esbuild, usadas nos testes)
        run: npm install --no-audit --no-fund
      - name: Atualiza a base de cartas (TCGdex)
        if: github.event_name != 'push'
        run: npm run sync
      - name: Lê efeitos novos com a IA (só com o segredo ANTHROPIC_API_KEY)
        if: github.event_name != 'push' && env.ANTHROPIC_API_KEY != ''
        run: node scripts/llm-classify.js --max 400
      # Salva ANTES dos testes: o que já foi pago à API nunca se perde (mesmo se um teste falhar depois)
      - name: Salva a base atualizada no repositório
        if: always() && github.event_name != 'push'
        run: |
          git config user.name "pokematch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cards.json
          if [ -f data/llm-effects.json ]; then git add data/llm-effects.json; fi
          git diff --cached --quiet || git commit -m "Atualiza base de cartas ($(date -u +%F))"
          git push
      - name: Testes
        run: npm test
      - name: Gera o site estático
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
