# Teste real do servidor do estrategista publicado (Lovable): faz o mesmo que o site e confere com o motor.
# Disparo manual (Actions → "Estrategista (teste do servidor)" → Run workflow). Custo: ~US$ 0,15 por execução.
name: Estrategista (teste do servidor)

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Endereço do servidor (vazio = deploy/strategist-url.txt)'
        required: false
        default: ''
      mine:
        description: 'Seu deck (arquivo em test/decks, sem .txt)'
        required: false
        default: 'sharpedo'
      opp:
        description: 'Deck do oponente (arquivo em test/decks, sem .txt)'
        required: false
        default: 'slowking'
      pain:
        description: 'Dor do jogador (opcional)'
        required: false
        default: 'Morro para o kyurem e depois nao volto mais'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Leitura real pelo servidor publicado
        env:
          PM_URL: ${{ inputs.url }}
          PM_MINE: ${{ inputs.mine }}
          PM_OPP: ${{ inputs.opp }}
          PM_PAIN: ${{ inputs.pain }}
        run: node scripts/strategist-remote-test.js
