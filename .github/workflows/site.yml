# Publica o Tech Finder no GitHub Pages.
# - A cada push na main: roda os testes, gera o site estático e publica.
# - Todo dia às 06:17 (UTC): baixa as cartas atualizadas do TCGdex e republica.
name: Site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Atualiza a base de cartas (TCGdex)
        if: github.event_name != 'push'
        run: npm run sync
      - name: Testes
        run: npm test
      - name: Salva a base atualizada no repositório
        if: github.event_name != 'push'
        run: |
          git config user.name "tech-finder-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/cards.json
          git diff --cached --quiet || git commit -m "Atualiza base de cartas ($(date -u +%F))"
          git push
      - name: Gera o site estático
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
